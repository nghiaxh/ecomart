spring:
  application:
    name: ecomart
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomart}
    username: ${SPRING_DATASOURCE_USERNAME:ecomart}
    password: ${SPRING_DATASOURCE_PASSWORD:ecomart-secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:ecomart-jwt-secret-change-me-in-production}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  client-url: ${CLIENT_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/orders}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/cart}
