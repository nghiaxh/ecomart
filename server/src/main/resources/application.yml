spring:
  application:
    name: ecomart
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomart}
    username: ${SPRING_DATASOURCE_USERNAME:ecomart}
    password: ${SPRING_DATASOURCE_PASSWORD:ecomart-secret}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:10800000}
  client-url: ${CLIENT_URL:http://localhost:5173}
  shop:
    shipping-fee: ${SHIPPING_FEE:20000}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:120000}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    customer-password: ${SEED_CUSTOMER_PASSWORD:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/orders}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/cart}
